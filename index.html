            };

            // create Expression function
            const createExpressionFunction = exp => {
                try {
                    return new Function("$data", "$el", `with($data){${exp}}`);
                } catch (error) {
                    console.error(`${error.message} in expression: ${exp}`);
                    return () => { };
                }
            };

            // directives
            const directives = {
                bind: bindDirective,
                on: onDirective,
                show: ({
                    el,
                    get
                }) => {
                    const display = el.style.display;
                    const effectFn = () => {
                        el.style.display = get() ? display : "none";
                    };
                    new ReactiveEffect(effectFn, null, el.scope).run();
                },
                text: textDirective,
                html: ({
                    el,
                    get
                }) => {
                    const effectFn = () => {
                        el.innerHTML = toString(get());
                    };
                    new ReactiveEffect(effectFn, null, el.scope).run();
                },
                model: ({
                    el,
                    exp,
                    get,
                    modifiers
                }) => {
                    const type = el.type;
                    const setter = get(`(val) => { ${exp} = val }`);
                    const {
                        trim,
                        number = type === "number"
                    } = modifiers || {};

                    if (el.tagName === "SELECT") {
                        const selectEl = el;
                        addEventListener(selectEl, "change", () => {
                            const selectedValues = Array.prototype.filter
                                .call(selectEl.options, option => option.selected)
                                .map(option => number ? looseToNumber(getInputValue(option)) : getInputValue(option));
                            setter(selectEl.multiple ? selectedValues : selectedValues[0]);
                        });
                        const effectFn = () => {
                            const modelValue = get();
                            const isMultiple = selectEl.multiple;
                            for (let i = 0, len = selectEl.options.length; i < len; i++) {
                                const option = selectEl.options[i];
                                const optionValue = getInputValue(option);
                                if (isMultiple) {
                                    if (isArray(modelValue)) {
                                        option.selected = looseIndexOf(modelValue, optionValue) > -1;
                                    } else {
                                        option.selected = modelValue.has(optionValue);
                                    }
                                } else if (looseEqual(getInputValue(option), modelValue)) {
                                    if (selectEl.selectedIndex !== i) selectEl.selectedIndex = i;
                                    return;
                                }
                            }
                            if (!isMultiple && selectEl.selectedIndex !== -1) {
                                selectEl.selectedIndex = -1;
                            }
                        };
                        new ReactiveEffect(effectFn, () => queueJob(effectFn), el.scope).run();
                    } else if (type === "checkbox") {
                        let prevValue;
                        addEventListener(el, "change", () => {
                            const modelValue = get();
                            const isChecked = el.checked;
                            if (isArray(modelValue)) {
                                const checkboxValue = getInputValue(el);
                                const index = looseIndexOf(modelValue, checkboxValue);
                                const hasValue = index !== -1;
                                if (isChecked && !hasValue) {
                                    setter(modelValue.concat(checkboxValue));
                                } else if (!isChecked && hasValue) {
                                    const newArray = [...modelValue];
                                    newArray.splice(index, 1);
                                    setter(newArray);
                                }
                            } else {
                                setter(getCheckboxOrRadioValue(el, isChecked));
                            }
                        });
                        const effectFn = () => {
                            const modelValue = get();
                            if (isArray(modelValue)) {
                                el.checked = looseIndexOf(modelValue, getInputValue(el)) > -1;
                            } else if (modelValue !== prevValue) {
                                el.checked = looseEqual(modelValue, getCheckboxOrRadioValue(el, true));
                            }
                            prevValue = modelValue;
                        };
                        new ReactiveEffect(effectFn, () => queueJob(effectFn), el.scope).run();
                    } else if (type === "radio") {
                        let prevValue;
                        addEventListener(el, "change", () => {
                            setter(getInputValue(el));
                        });
                        const effectFn = () => {
                            const modelValue = get();
                            if (modelValue !== prevValue) {
                                el.checked = looseEqual(modelValue, getInputValue(el));
                            }
                            prevValue = modelValue;
                        };
                        new ReactiveEffect(effectFn, () => queueJob(effectFn), el.scope).run();
                    } else {
                        const isTextarea = el.tagName === "TEXTAREA";
                        const triggerEvent = (modifiers && modifiers.lazy) ? "change" : "input";
                        const hasComposition = !isTextarea && type === "text";

                        addEventListener(el, triggerEvent, () => {
                            if (hasComposition && el.composing) return;
                            let value = getInputValue(el);
                            if (trim) value = value.trim();
                            if (number) value = looseToNumber(value);
                            setter(value);
                        });

                        if (hasComposition) {
                            addEventListener(el, "compositionstart", onCompositionStart);
                            addEventListener(el, "compositionend", onCompositionEnd);
                        }


                        // Fixed effect to update input value reactively
                        const effectFn = () => {
                            const value = get();
                            if (el.value !== value) {
                                el.value = value == null ? "" : value;
                            }
                        };

                        new ReactiveEffect(effectFn, () => queueJob(effectFn), el.scope).run();
                        // *** FIX ENDS HERE ***
                    }
                },
                cloak: ({
                    el
                }) => el.removeAttribute("v-cloak")
            };

            // Parses a string containing {{ }} interpolations into text and expression tokens
            const parseText = (text) => {
                if (typeof text !== "string" || !text.includes("}}")) { return null; }
                const tokens = [];
                const interpolationRegex = /\{\{((?:.|\r?\n)+?)\}\}/g;
                let lastIndex = 0;
                let match;
                while ((match = interpolationRegex.exec(text)) !== null) {
                    const matchStart = match.index;
                    const matchEnd = matchStart + match[0].length;
                    // Add preceding plain text as a token
                    if (matchStart > lastIndex) {
                        tokens.push({ type: "text", value: text.slice(lastIndex, matchStart) });
                    }
                    // Add the interpolated expression as a token
                    tokens.push({ type: "expression", value: match[1].trim() });
                    lastIndex = matchEnd;
                }

                // Add any remaining text after the last match
                if (lastIndex < text.length) {
                    tokens.push({
                        type: "text",
                        value: text.slice(lastIndex)
                    });
                }
                return tokens;
            };

            // Walk through the DOM and initialize directives and text nodes
            const walk = (el, scope) => {
                for (const node of [...el.childNodes]) {
                    if (node.nodeType === 3) { // Text node
                        const tokens = parseText(node.data);
                        if (tokens && tokens.length) {
                            const parent = node.parentNode;
                            const fragment = document.createDocumentFragment();
                            for (const token of tokens) {
                                if (token.type === 'expression') {
                                    const textNode = document.createTextNode('');
                                    fragment.appendChild(textNode);
                                    const effectFn = () => {
                                        // Ensure reactive dependencies are tracked
                                        const value = scope.evaluate(token.value, node);
                                        textNode.data = toString(value);
                                    };
                                    // Use queueJob to batch updates and ensure reactivity
                                    new ReactiveEffect(effectFn, () => queueJob(effectFn), scope).run();
                                } else {
                                    fragment.appendChild(document.createTextNode(token.value));
                                }
                            }
                            parent.replaceChild(fragment, node);
                        }
                    } else if (node.nodeType === 1) { // Element node
                        if (!node.hasAttribute('v-scope')) {
                            walk(node, scope);
                        }
                    }
                }
            };

            // Scope
            class Scope {
                // Constructor for Scope
                constructor(el, data = {}, parentScope = null, availableDirectives) {
                    this.el = el;
                    this.el.scope = this;
                    this.effects = [];
                    this.parent = parentScope;
                    this.data = reactive(data);
                    this.availableDirectives = availableDirectives;
                    this.init();
                }
                // Evaluate an expression in the context of this scope
                evaluate(exp, el) {
                    return evaluateExpression(this.data, exp, el);
                }
                // Initialize the scope by processing directives and attributes
                init() {
                    const dataProxy = this.data;
                    const directiveAttributes = [];
                    const allElements = [this.el, ...this.el.querySelectorAll('*')];

                    for (const element of allElements) {
                        const closestScopeEl = element.closest('[v-scope]');
                        if (element === this.el || (closestScopeEl && closestScopeEl === this.el)) {
                            for (const attr of [...element.attributes]) {
                                if (attr.name.startsWith('v-')) {
                                    directiveAttributes.push(attr);
                                }
                            }
                        }
                    }
                    // Sort directive attributes by their names to ensure consistent processing order
                    directiveAttributes.sort((a, b) => {
                        const order = ["cloak", "if", "for", "bind", "on", "model", "text", "html", "show"];
                        const aName = a.name.split(/[:.]/)[0];
                        const bName = b.name.split(/[:.]/)[0];
                        return order.indexOf(aName) - order.indexOf(bName);
                    }).forEach(attr => {
                        const {
                            name,
                            value,
                            ownerElement
                        } = attr;
                        const [directiveFullName, ...modifierStrings] = name.split(".");
                        const [directiveName, arg] = directiveFullName.split(":");
                        const directive = directiveName.substring(2);
                        const expression = value;
                        const modifiers = Object.fromEntries(modifierStrings.map(m => [m, true]));

                        const handler = this.availableDirectives[directive];
                        if (handler) {
                            const get = (exp = expression) => evaluateExpression(dataProxy, exp, ownerElement);

                            handler({
                                el: ownerElement,
                                exp: expression,
                                arg,
                                modifiers,
                                get
                            });
                        }
                        ownerElement.removeAttribute(name);
                    });

                    walk(this.el, this);
                }

                teardown() {
                    this.effects.forEach(effect => effect.stop());
                }
            };

            // init
            const init = (initialData = {}) => {
                let scopes = [];
                const localDirectives = Object.assign({}, directives);
                let appData = reactive(initialData);
                // Create the main app object
                const app = {
                    data(dataObject) {
                        appData = reactive(dataObject);
                        return app;
                    },
                    directive(name, directive) {
                        localDirectives[name] = directive;
                        return app;
                    },
                    plugin(pluginFn) {
                        pluginFn(app);
                        return app;
                    },
                    get scope() {
                        return scopes[0] && scopes[0].data;
                    },
                    get directives() {
                        return localDirectives;
                    },
                    get(key) {
                        return localDirectives[key];
                    },
                    set(key, fn) {
                        localDirectives[key] = fn;
                        return app;
                    },
                    mount(rootElement) {
                        if (isString(rootElement) && !(rootElement = document.querySelector(rootElement))) return;
                        let rootElements;
                        rootElements = (rootElement = rootElement || document.documentElement).hasAttribute("v-scope") ? [rootElement] : [...rootElement.querySelectorAll("[v-scope]")].filter(child => !child.matches("[v-scope] [v-scope]"));
                        if (!rootElements.length) rootElements = [rootElement];
                        scopes = rootElements.map(el => new Scope(el, appData, null, localDirectives));
                        return app.scope;
                    },
                    unmount() {
                        scopes.forEach(scope => scope.teardown());
                    }
                };
                return app;
            };

            // Export the xfvue object
            const currentScript = document.currentScript;
            if (currentScript && currentScript.hasAttribute("init")) { init().mount(); }

            exports.createApp = init;
            exports.nextTick = nextTick;
            exports.reactive = reactive;
            return exports;
        }({});

        var scope = document.getElementById('app');
        var vz = {
            msg: "hello xf",
            count: 875,
            s: function () { console.log(this.msg); }
        };
        var app = xfvue.createApp(vz).mount(scope);
    </script>
</body>
